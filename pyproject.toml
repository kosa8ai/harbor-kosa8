[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbor-kosa8"
version = "0.2.0"
description = "kosa8 Cloud environment for Harbor (Terminal-Bench)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kosa8" }]
requires-python = ">=3.12"
keywords = ["harbor", "terminal-bench", "evals", "sandbox", "kosa8"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "harbor>=0.25",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://kosa8.com"
Documentation = "https://github.com/kosa8ai/harbor-kosa8#readme"
Repository = "https://github.com/kosa8ai/harbor-kosa8"
Issues = "https://github.com/kosa8ai/harbor-kosa8/issues"

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["harbor_kosa8"]

[tool.hatch.build.targets.sdist]
include = ["harbor_kosa8", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 140
